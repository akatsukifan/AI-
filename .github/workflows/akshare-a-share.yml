name: AKShare A-share public market data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/akshare-a-share.yml"
      - "a-share-research/scripts/**"
  schedule:
    # 16:40 Beijing time, Monday-Friday (UTC 08:40). GitHub schedules may run late.
    - cron: "40 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: akshare-a-share-data
  cancel-in-progress: false

jobs:
  fetch-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: a-share-research/requirements.txt
      - name: Install data library
        run: python -m pip install -r a-share-research/requirements.txt
      - name: Test collector (offline fixtures)
        run: python -m unittest discover -s a-share-research/scripts -p 'test_*.py'
      - name: Fetch two public A-share stock histories
        id: collect
        run: python a-share-research/scripts/collect.py
      - name: Upload collected data to repo
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a-share-research/reports/
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "data: refresh A-share AKShare observations"
            git push
          fi

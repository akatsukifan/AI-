name: AKShare A-share intraday public data
on:
  workflow_dispatch:
  push:
    paths:
      - "a-share-research/intraday/**"
      - ".github/workflows/akshare-intraday.yml"
  schedule:
    # Beijing 09:35, 10:05, 10:35, 11:05, 11:35, 13:05, 13:35, 14:05, 14:35, 15:05.
    - cron: "35 1 * * 1-5"
    - cron: "5,35 2,3,5,6 * * 1-5"
    - cron: "5 7 * * 1-5"
permissions:
  contents: write
concurrency:
  group: akshare-a-share-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: a-share-research/requirements.txt
      - run: python -m pip install -r a-share-research/requirements.txt
      - name: Test minute normalization
        run: python -m unittest discover -s a-share-research/intraday -p 'test_*.py'
      - name: Fetch public minute data
        id: fetch
        run: python a-share-research/intraday/collect_intraday.py
      - name: Publish public observations
        if: ${{ !cancelled() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a-share-research/reports/intraday/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public A-share minute observations"
            git push
          fi

name: Bilibili public research connectivity probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bilibili-public-probe.yml"
      - "bilibili-research/probe.py"

permissions:
  contents: read

jobs:
  test-public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test public video metadata and comments without login
        run: python bilibili-research/probe.py
